apiVersion: apps/v1
kind: Deployment
metadata:
  name: athe-backend
  namespace: athe-chat
  labels:
    app: athe-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: athe-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: athe-backend
    spec:
      # If pods need direct AWS API access (e.g. Secrets Manager via IRSA), attach
      # a dedicated ServiceAccount annotated with an IAM role ARN here instead.
      spec:
      serviceAccountName: athe-backend-sa
      containers:
        - name: backend
          image: 077024820219.dkr.ecr.ap-south-1.amazonaws.com/athe-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: athe-backend-config
            - secretRef:
                name: athe-backend-secret
          resources:
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: athe-backend
  namespace: athe-chat
spec:
  selector:
    app: athe-backend
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: athe-backend-pdb
  namespace: athe-chat
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: athe-backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: athe-backend-hpa
  namespace: athe-chat
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: athe-backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
