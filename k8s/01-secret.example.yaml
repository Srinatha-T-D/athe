# DO NOT commit a real copy of this file with real values to git.
# Copy to 01-secret.yaml, fill in real values, and apply it - or better,
# manage this via AWS Secrets Manager + the External Secrets Operator / IRSA
# instead of a plain Kubernetes Secret. Kept here as the simplest working option.
apiVersion: v1
kind: Secret
metadata:
  name: athe-backend-secret
  namespace: athe-chat
type: Opaque
stringData:
  # AWS DocumentDB (Mongo-compatible) or MongoDB Atlas connection string.
  MONGO_URL: "mongodb://<user>:<password>@<docdb-cluster-endpoint>:27017/?tls=true&replicaSet=rs0&readPreference=secondaryPreferred&retryWrites=false"
  DB_NAME: "athe_chat"
  # openssl rand -hex 32
  JWT_SECRET: "REPLACE_WITH_LONG_RANDOM_SECRET"
  # AWS ElastiCache (Redis) primary endpoint. REQUIRED once you run more than
  # one backend replica (this deployment defaults to 2-8 via the HPA) -
  # without it, a DM/room message only reaches the recipient if their
  # WebSocket happens to be held by the same pod that received it.
  # redis:// for a plain ElastiCache cluster, rediss:// if in-transit
  # encryption is enabled on the replication group.
  REDIS_URL: "redis://<elasticache-primary-endpoint>:6379/0"
