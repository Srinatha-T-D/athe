name: Build, Push & Deploy

# Push to main builds & deploys automatically. Any other branch/PR only
# builds (sanity-checks the Dockerfiles) without touching the cluster.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPO_BACKEND: athe-backend
  ECR_REPO_FRONTEND: athe-frontend
  EKS_CLUSTER_NAME: athe-cluster
  K8S_NAMESPACE: athe-chat

permissions:
  id-token: write   # required for OIDC -> AWS role assumption
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: |
          black --check .
          flake8 . --max-line-length=120 --extend-ignore=E203
      - name: Import sanity check
        working-directory: backend
        run: |
          MONGO_URL="mongodb://localhost:27017" DB_NAME=test JWT_SECRET=test JWT_ALGORITHM=HS256 \
            python -c "import server"

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: "" # runtime-injected in the container, not needed at build time
        run: npm run build

  build-and-push:
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }} # OIDC role, see DEPLOY.md step 7
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          TAG: ${{ steps.vars.outputs.sha_short }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPO_BACKEND:$TAG" -t "$REGISTRY/$ECR_REPO_BACKEND:latest" ./backend
          docker push "$REGISTRY/$ECR_REPO_BACKEND:$TAG"
          docker push "$REGISTRY/$ECR_REPO_BACKEND:latest"

      - name: Build & push frontend image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          TAG: ${{ steps.vars.outputs.sha_short }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPO_FRONTEND:$TAG" -t "$REGISTRY/$ECR_REPO_FRONTEND:latest" ./frontend
          docker push "$REGISTRY/$ECR_REPO_FRONTEND:$TAG"
          docker push "$REGISTRY/$ECR_REPO_FRONTEND:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Set images and roll out
        env:
          TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          REGISTRY=$(aws ecr describe-repositories --repository-names "$ECR_REPO_BACKEND" --query 'repositories[0].repositoryUri' --output text | cut -d/ -f1)
          kubectl -n "$K8S_NAMESPACE" set image deployment/athe-backend backend="$REGISTRY/$ECR_REPO_BACKEND:$TAG"
          kubectl -n "$K8S_NAMESPACE" set image deployment/athe-frontend frontend="$REGISTRY/$ECR_REPO_FRONTEND:$TAG"
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/athe-backend --timeout=180s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/athe-frontend --timeout=180s
